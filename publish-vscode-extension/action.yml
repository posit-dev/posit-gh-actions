name: "Publish VS Code Extension"
description: "Publish a pre-built VS Code extension (.vsix) to the VS Marketplace or the Open VSX Registry."

inputs:
  pat:
    description: "Personal access token."
    required: true
  extensionFile:
    description: "Path to the .vsix file to publish."
    required: true
  registryUrl:
    description: "Registry URL. Use 'https://marketplace.visualstudio.com' for VS Marketplace, or an Open VSX registry URL."
    required: false
    default: "https://open-vsx.org"
  skipDuplicate:
    description: "Fail silently if this version already exists on the registry."
    required: false
    default: "false"
  dryRun:
    description: 'Set to "true" to skip publishing (useful for CI testing).'
    required: false
    default: "false"

outputs:
  vsixPath:
    description: "The path to the published VSIX file."
    value: ${{ inputs.extensionFile }}

runs:
  using: "composite"
  steps:
    - name: Validate extension file
      shell: bash
      env:
        EXTENSION_FILE: ${{ inputs.extensionFile }}
      run: |
        if [[ ! -f "$EXTENSION_FILE" ]]; then
          echo "::error::extensionFile not found at: $EXTENSION_FILE"
          exit 1
        fi
        echo "Extension file found: $EXTENSION_FILE"

    - name: Install vsce and ovsx
      if: inputs.dryRun != 'true'
      shell: bash
      run: npm install -g @vscode/vsce ovsx

    - name: Publish extension
      if: inputs.dryRun != 'true'
      shell: bash
      env:
        EXTENSION_FILE: ${{ inputs.extensionFile }}
        REGISTRY_URL: ${{ inputs.registryUrl }}
        INPUT_PAT: ${{ inputs.pat }}
        SKIP_DUPLICATE: ${{ inputs.skipDuplicate }}
      run: |
        REGISTRY_URL="${REGISTRY_URL%/}"

        if [[ "$REGISTRY_URL" == "https://marketplace.visualstudio.com" ]]; then
          CMD=(vsce publish --packagePath "$EXTENSION_FILE" --pat "$INPUT_PAT")
          if [[ "$SKIP_DUPLICATE" == "true" ]]; then
            CMD+=(--skip-duplicate)
          fi
        else
          CMD=(ovsx publish "$EXTENSION_FILE" --pat "$INPUT_PAT" --registryUrl "$REGISTRY_URL")
          if [[ "$SKIP_DUPLICATE" == "true" ]]; then
            CMD+=(--skip-duplicate)
          fi
        fi

        REDACTED_CMD="${CMD[*]}"
        REDACTED_CMD="${REDACTED_CMD//"$INPUT_PAT"/***}"
        echo "Running: $REDACTED_CMD"
        "${CMD[@]}"
